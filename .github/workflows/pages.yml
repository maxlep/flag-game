# Deploys main at the site root and the preview branch under /preview/, as one GitHub Pages site.
# Pages must be set to "GitHub Actions" as its source (Settings > Pages > Build and deployment).
name: Pages
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: preview
          path: site/preview
      - name: Label the preview and list the site
        run: |
          rm -rf site/.git site/.github site/preview/.git site/preview/.github
          # Tell the two apart on a phone's home screen and in the page title.
          sed -i 's/"short_name": "Flags"/"short_name": "Flags preview"/; s/"name": "Flags of the World"/"name": "Flags of the World (preview)"/' site/preview/manifest.webmanifest
          sed -i 's|<meta name="apple-mobile-web-app-title" content="Flags">|<meta name="apple-mobile-web-app-title" content="Flags preview">|' site/preview/index.html
          test -f site/index.html && test -f site/preview/index.html
          { echo '### Site'; echo '```'; find site -maxdepth 2 -not -path '*/flags*' | sort; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
