<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A quiz for learning the flags of the world, with the meaning behind each flag.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Flags of the World</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Flags">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3f8f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a field guide; the flag is always the largest thing on screen. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#15223a; --muted:#5b6678; --line:#d6dbe4;
  --accent:#1e3f8f; --accent-ink:#ffffff; --tint:#e3e9f6; --gold:#c9961a;
  --ok:#1f7a4c; --ok-tint:#dff3e7; --bad:#b4262b; --bad-tint:#fbe3e3;
  --display:"Bricolage Grotesque","Avenir Next",Helvetica,Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1521; --surface:#182033; --ink:#eef1f7; --muted:#a3adc2; --line:#2a3550;
  --accent:#4f7ee8; --accent-ink:#ffffff; --tint:#1f2b47; --gold:#e8b63f;
  --ok:#5ad08f; --ok-tint:#15301f; --bad:#ff8a8f; --bad-tint:#3b1c1e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1521; --surface:#182033; --ink:#eef1f7; --muted:#a3adc2; --line:#2a3550;
  --accent:#4f7ee8; --accent-ink:#ffffff; --tint:#1f2b47; --gold:#e8b63f;
  --ok:#5ad08f; --ok-tint:#15301f; --bad:#ff8a8f; --bad-tint:#3b1c1e; color-scheme:dark }

*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h1.brand{font-size:20px;font-weight:700;letter-spacing:0}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding-block:12px 10px;margin-top:-12px;
  box-shadow:0 8px 12px -10px rgba(10,20,40,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .back{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.top .stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.flag{width:100%;max-width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.flag .fl{height:100%;aspect-ratio:var(--r,4/3);max-width:100%;border-radius:6px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(10,20,40,.12)}
.flag .fl.wide{height:auto;width:100%}
.flag .fl.bare{background:transparent;box-shadow:none;border-radius:0}
.flag img{display:block;width:100%;height:100%;object-fit:fill}
.flag.sm .fl{border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.flag.sm .fl.bare{box-shadow:none}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;font-weight:600;font-size:16px;min-height:52px;transition:transform .08s}
.opt .key{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.lore{border-left:4px solid var(--accent)}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.lore p{max-width:65ch}
.capital{font-family:var(--mono);font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;border-radius:10px;padding:14px 18px;min-height:50px;width:100%;font-family:var(--display);font-size:17px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .08s}
.tile:active,.opt:active,.fopt:active{transform:scale(.985)}
.tile .name{font-family:var(--display);font-weight:700;font-size:18px}
.tile .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.tile.wide .name{font-size:17px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:0}
.pill{font-family:var(--mono);font-size:12px;background:var(--tint);color:var(--ink);border-radius:999px;padding:4px 10px}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.ok{background:var(--ok-tint);color:var(--ok)}

.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.bad{background:var(--bad)} .progress i.now{background:var(--accent)}

.study{display:flex;flex-direction:column;gap:12px}
.entry{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.entry .flag .fl{border-radius:4px}
.entry .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.entry .t .name{font-family:var(--display);font-weight:700;font-size:16px}
.entry p{font-size:14px;color:var(--ink)}
.group{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.group .flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.group .flags figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.group .flags figcaption{font-size:12px;font-weight:600;line-height:1.2}
.group .hint{font-size:14px;color:var(--ink);max-width:65ch}
.missed{display:flex;flex-wrap:wrap;gap:8px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:grid;grid-template-columns:36px 1fr;column-gap:10px;row-gap:2px;align-items:start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;opacity:.55}
.badge .be{grid-row:1/3;font-size:28px;line-height:1.2;filter:grayscale(1);text-align:center}
.badge.on .be{filter:none}
.badge.big .be{font-size:40px}
.badge.on{opacity:1;border-color:var(--gold);background:var(--surface)}
.badge .bn{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2}
.badge .bh{font-size:12px;color:var(--muted);line-height:1.35}
.badge.on .bh{color:var(--ink)}
.badge.big{grid-column:1/-1;grid-template-columns:56px 1fr}
.newbadge{border-left:4px solid var(--gold)}
.newbadge .be{font-size:40px;line-height:1}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;font-weight:600}
.chip .flag{width:28px;aspect-ratio:4/3}
.chip .flag .fl{border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.grid{font-size:18px;line-height:1.25;letter-spacing:1px;word-break:break-all;max-width:100%}
.sharebox{width:100%;font:13px var(--mono);color:var(--ink);background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:120px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.link{color:var(--accent);font-weight:600;font-size:14px}
.wl{color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);transition:text-decoration-color .12s}
.wl:hover,.wl:focus-visible{text-decoration-color:var(--accent);color:var(--accent)}
.capital .wl{text-decoration-thickness:1px}
a.flink{display:block;border-radius:4px}
.tabs{display:flex;gap:6px;background:var(--tint);padding:4px;border-radius:10px}
.tabs button{flex:1;padding:8px;border-radius:7px;font-weight:600;font-size:14px;transition:background .12s}
.tabs button.on,.seg .btns button.on{color:var(--accent-ink);background:var(--accent)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.seg{display:flex;flex-direction:column;gap:6px}
.seg .label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg .btns{display:flex;gap:6px;background:var(--tint);padding:4px;border-radius:10px}
.seg .btns button{flex:1;padding:8px 4px;border-radius:7px;font-weight:600;font-size:14px;min-width:0;transition:background .12s}
.seg .btns button.off{opacity:.4}
.seg .note{font-size:13px;color:var(--muted)}
.flagopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fopt{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.fopt .flag .fl{box-shadow:0 0 0 1px var(--line)}
.fopt .key{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fopt.right{border-color:var(--ok);background:var(--ok-tint)}
.fopt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.fopt.dim{opacity:.45}
.fopt[disabled]{cursor:default}
.ask{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.typebox{display:flex;flex-direction:column;gap:8px}
.typebox input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.typebox input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
.sugg{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.sugg button{background:var(--tint);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.kbd{display:none;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media (hover:hover) and (pointer:fine){.kbd{display:flex}}
kbd{font:12px var(--mono);color:var(--ink);background:var(--tint);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- DATA ----------
// Each: [code, name, region, capital, meaning]
const EU="Europe",AS="Asia",AF="Africa",AM="Americas",OC="Oceania";
const RAW=[
["al","Albania",EU,"Tirana","A two-headed black eagle on red. The eagle was the emblem of Skanderbeg, the 15th-century hero who held off the Ottomans, and Albanians' own name for their country, Shqipëri, is often glossed as 'land of eagles'."],
["ad","Andorra",EU,"Andorra la Vella","Blue, yellow and red vertical stripes with the coat of arms. Blue and red come from France, yellow and red from Spain: the two neighbours whose heads of state jointly serve as Andorra's co-princes. Without the arms it would match Romania and Chad."],
["at","Austria",EU,"Vienna","Red, white, red. Legend says Duke Leopold V's white tunic was soaked in blood after a battle in 1191 except for the strip under his belt. One of the oldest flag designs still in use."],
["by","Belarus",EU,"Minsk","Red over green with a white-and-red woven pattern at the hoist, a traditional rushnyk (ritual towel) design. Red for past struggles, green for forests and the future."],
["be","Belgium",EU,"Brussels","Black, yellow, red in vertical stripes, from the arms of the Duchy of Brabant: a gold lion with red claws and tongue on black. The vertical layout copies France; Germany uses similar colours horizontally."],
["ba","Bosnia and Herzegovina",EU,"Sarajevo","A yellow triangle on blue with a diagonal row of white stars. The three points stand for the three main peoples (Bosniaks, Croats, Serbs) and echo the country's shape; the blue and stars nod to the EU flag. Designed in 1998 to favour no group."],
["bg","Bulgaria",EU,"Sofia","White for peace, green for farmland, red for courage. It is the Russian white-blue-red with blue swapped for green."],
["hr","Croatia",EU,"Zagreb","Red, white, blue with the red-and-white checkerboard shield (šahovnica), topped by a crown of five small historical crests. The checkerboard is the giveaway among pan-Slavic tricolours."],
["cy","Cyprus",EU,"Nicosia","A copper-orange silhouette of the island (copper gave Cyprus its name) over two olive branches for peace between Greek and Turkish Cypriots. The white field deliberately avoids both Greek blue and Turkish red."],
["cz","Czechia",EU,"Prague","White and red are Bohemia's colours; the blue triangle at the hoist was added in 1920 so the flag would no longer be identical to Poland's."],
["dk","Denmark",EU,"Copenhagen","The Dannebrog: a white Nordic cross on red. Legend says it fell from the sky during a battle in Estonia in 1219. Often called the oldest continuously used national flag, and the model for every other Nordic cross."],
["ee","Estonia",EU,"Tallinn","Blue for the sky and loyalty, black for the soil and past suffering, white for snow and hope. Chosen by a student society in 1881."],
["fi","Finland",EU,"Helsinki","A blue Nordic cross on white: the country's thousands of lakes and its winter snow."],
["fr","France",EU,"Paris","The tricolour of the Revolution. White was the colour of the monarchy; blue and red were the colours of Paris. It inspired dozens of other vertical tricolours."],
["de","Germany",EU,"Berlin","Black, red and gold come from the uniforms of the Lützow Free Corps in the Napoleonic wars (black coats, red facings, gold buttons), taken up by the liberal revolution of 1848."],
["gr","Greece",EU,"Athens","Nine blue-and-white stripes, often said to count the syllables of 'Eleftheria i Thanatos' (Freedom or Death). The cross in the canton stands for Greek Orthodoxy."],
["hu","Hungary",EU,"Budapest","Red for strength, white for faithfulness, green for hope, the colours of the medieval Hungarian arms. Note the order: Bulgaria is white on top, Iran has green on top."],
["is","Iceland",EU,"Reykjavík","A red cross edged in white on blue: fire (volcanoes), ice (glaciers) and the sea. It is Norway's colours inverted: Norway is red with a blue cross."],
["ie","Ireland",EU,"Dublin","Green for the Gaelic and Catholic tradition, orange for the Protestant followers of William of Orange, and white for peace between them. Côte d'Ivoire is the same flag reversed."],
["it","Italy",EU,"Rome","Green, white, red, modelled on the French tricolour; the colours come from Milanese civic guard uniforms of 1796. Mexico uses the same stripes with an eagle at centre."],
["xk","Kosovo",EU,"Pristina","A gold map of the country under six white stars for its six main communities, on blue. Adopted at independence in 2008; Cyprus is the only other flag that uses a map."],
["lv","Latvia",EU,"Riga","Deep carmine with a white stripe. Legend tells of a wounded leader wrapped in a white sheet that was stained red on both sides. The design is recorded in a 13th-century chronicle."],
["li","Liechtenstein",EU,"Vaduz","Blue over red with a gold crown. The crown was added in 1937 after the team arrived at the 1936 Berlin Olympics and discovered Haiti's flag was identical."],
["lt","Lithuania",EU,"Vilnius","Yellow for the sun and prosperity, green for forests and hope, red for the blood shed for the homeland."],
["lu","Luxembourg",EU,"Luxembourg","Red, white and a light sky blue, from the Grand Duke's arms (a red lion on white-and-blue stripes). The pale blue is the clue that separates it from the Netherlands."],
["mt","Malta",EU,"Valletta","White and red, said to come from the colours of Count Roger of Sicily in 1091. The George Cross in the corner was awarded to the whole island for its bravery under siege in 1942."],
["md","Moldova",EU,"Chișinău","Blue, yellow, red like Romania (shared language and history), with Moldova's arms: an eagle holding a shield with an aurochs head, star, rose and crescent."],
["mc","Monaco",EU,"Monaco","Red over white, the heraldic colours of the Grimaldi family who have ruled since the 13th century. Indonesia's flag is the same except for its proportions."],
["me","Montenegro",EU,"Podgorica","A gold-bordered red field with the double-headed eagle of the Petrović dynasty; the lion on its chest stands for the Church."],
["nl","Netherlands",EU,"Amsterdam","Originally orange, white and blue for William of Orange, but the orange dye faded or turned red at sea, so red was adopted. The oldest tricolour, and the inspiration for Russia's."],
["mk","North Macedonia",EU,"Skopje","A gold sun with eight widening rays on red, 'the new sun of liberty' from the national anthem. It replaced the Vergina Sun in 1995 after a dispute with Greece over that ancient symbol."],
["no","Norway",EU,"Oslo","A blue cross outlined in white on red. Red, white and blue were chosen in 1821 as the colours of liberty (France, the US), laid on the Nordic cross."],
["pl","Poland",EU,"Warsaw","White over red, from the white eagle on a red shield in Poland's arms. Indonesia and Monaco are the same flag upside down."],
["pt","Portugal",EU,"Lisbon","Green for hope and red for the blood of the 1910 republic. The armillary sphere was a navigation instrument of the Age of Discovery; the shield carries five small shields and seven castles from the medieval kingdom."],
["ro","Romania",EU,"Bucharest","Blue, yellow, red, combining the colours of Wallachia and Moldavia in the 1848 revolution. Chad's flag is almost identical; Chad's blue is a touch darker."],
["ru","Russia",EU,"Moscow","White, blue, red, adopted by Peter the Great in the 1690s, reportedly after seeing the Dutch flag. These became the pan-Slavic colours used by Slovakia, Slovenia and Serbia."],
["sm","San Marino",EU,"San Marino","White (the snow on Monte Titano, and purity) over light blue (the sky, and liberty), with arms showing the three towers on the mountain's three peaks."],
["rs","Serbia",EU,"Belgrade","Pan-Slavic red, blue, white with the arms: a white double-headed eagle and a cross with four firesteels, read as four Cyrillic 'C's for 'Only Unity Saves the Serbs'."],
["sk","Slovakia",EU,"Bratislava","White, blue, red pan-Slavic stripes with a shield: a white double cross on three blue hills for the Tatra, Fatra and Mátra ranges."],
["si","Slovenia",EU,"Ljubljana","White, blue, red with a shield showing Mount Triglav, the highest peak, three gold stars from the Counts of Celje, and wavy lines for the sea and rivers."],
["es","Spain",EU,"Madrid","Red and yellow, the colours of the Crown of Aragon, picked in 1785 because they were easy to spot at sea. The arms combine Castile, León, Aragon, Navarre and Granada between the Pillars of Hercules."],
["se","Sweden",EU,"Stockholm","A yellow Nordic cross on blue, taken from the national arms of three gold crowns on blue."],
["ch","Switzerland",EU,"Bern","A white cross on red, from the field sign of the Swiss Confederates in the 14th century. One of only two square national flags; the other is Vatican City's."],
["ua","Ukraine",EU,"Kyiv","Blue sky over a golden wheat field. The colours come from the arms of the medieval kingdom of Galicia-Volhynia."],
["gb","United Kingdom",EU,"London","The Union Jack layers three crosses: St George (England, red on white), St Andrew (Scotland, white diagonal on blue) and St Patrick (Ireland, red diagonal)."],
["va","Vatican City",EU,"Vatican City","Yellow and white with the crossed keys of St Peter (gold for heaven, silver for earth) under the papal tiara. Square, like Switzerland's."],

["af","Afghanistan",AS,"Kabul","Black for the past, red for blood shed for independence, green for hope and Islam, with an emblem of a mosque, pulpit and wheat. This is the republic's flag; the Taliban replaced it with a plain white banner in 2021, and this design is still widely used by Afghans abroad."],
["am","Armenia",AS,"Yerevan","Red for the blood shed for survival and the Christian faith, blue for the sky and hope, orange (often called apricot) for the creativity and hard work of the people."],
["az","Azerbaijan",AS,"Baku","Blue for Turkic heritage, red for progress and modernity, green for Islam. The eight-pointed star stands for the eight branches of the Turkic peoples."],
["bh","Bahrain",AS,"Manama","Red with a white band joined by five white points, one for each of the Five Pillars of Islam. Qatar's neighbouring flag is maroon with nine points."],
["bd","Bangladesh",AS,"Dhaka","A red disc, the sun rising over Bengal and the blood of the 1971 war, on green for the lush land. The disc sits slightly toward the hoist so it looks centred when flying. Japan's is red on white; Palau's is yellow on blue."],
["bt","Bhutan",AS,"Thimphu","A white thunder dragon (druk) clutching jewels across a diagonal of yellow (the secular monarchy) and orange (Buddhism). Bhutan calls itself Druk Yul, Land of the Thunder Dragon."],

 ae:["uae","emirates"],ps:["palestinian territories","state of palestine"],tw:["republic of china","chinese taipei"],cn:["prc","people's republic of china"],
 gm:["gambia"],bs:["the bahamas"],st:["sao tome","sao tome and principe"],fm:["federated states of micronesia"],ru:["russian federation"],ir:["persia"],
 kn:["st kitts and nevis","saint kitts"],lc:["st lucia"],vc:["st vincent","st vincent and the grenadines","saint vincent"],bn:["brunei darussalam"],
 la:["lao"],ba:["bosnia"],tt:["trinidad"],ag:["antigua"],sa:["ksa"],sy:["syrian arab republic"],eg:["misr"],my:["malaysia"],lk:["ceylon"],xk:["kosova"],

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]/g,"");

const ALIASN=Object.fromEntries(Object.entries(ALIASES).map(([c,a])=>[c,a.map(norm)]));
function matchTyped(text){
  const t=norm(text);if(!t)return null;
  const exact=NAMES.find(x=>x.n===t);if(exact)return exact.c;
  for(const [c,a] of Object.entries(ALIASN))if(a.includes(t))return c;
  if(t.length>=4){const pre=NAMES.filter(x=>x.n.startsWith(t));if(pre.length===1)return pre[0].c}
  return null;
}
function suggest(text){
  const t=norm(text);if(t.length<2)return [];
  const out=[];
  NAMES.forEach(x=>{if(x.n.startsWith(t))out.push(x.c)});
  NAMES.forEach(x=>{if(!out.includes(x.c)&&x.n.includes(t))out.push(x.c)});
  Object.entries(ALIASN).forEach(([c,a])=>{if(!out.includes(c)&&a.some(y=>y.startsWith(t)))out.push(c)});
  return out.slice(0,5);
}

function checkBadges(){
  const n=S.qs.length,right=S.qs.filter(q=>q.ans===q.c).length,perfect=right===n;
  const D={easy:0,medium:1,hard:2,expert:3}[S.diff]||0,typed=S.diff==="expert"&&S.dir==="name";
  const mc=FLAGS.filter(f=>mastered(f.c)).length,earned=[];
  const award=id=>{if(!badges[id]){badges[id]=Date.now();earned.push(id)}};
  award("first");
  if(perfect&&n>=10&&D>=1)award("clean10");
  if(perfect&&n>=25&&D>=2)award("sharp25");
  if(perfect&&n>=25&&typed)award("typed25");
  if(perfect&&n>=25&&S.dir==="flag"&&D>=2)award("mirror");
  if(S.mode==="all"&&S.full)award("tour");
  if(S.mode==="group"&&perfect){const t=badges._twins=badges._twins||[];if(!t.includes(S.arg))t.push(S.arg);if(t.length>=10)award("twins")}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function poolFor(mode,arg){
  if(mode==="region")return FLAGS.filter(f=>f.r===arg).map(f=>f.c);
  if(mode==="all")return FLAGS.map(f=>f.c);
  if(mode==="weak")return FLAGS.map(f=>f.c).filter(c=>rec(c).w>0&&!mastered(c));
  if(mode==="group")return GROUPS[arg].f.slice();
  return [];
}
function pickOrder(pool,n){
  // unseen first, then weakest, then random; take n
  const w=pool.map(c=>{const r=rec(c);let s=Math.random();if(!seen(c))s+=3;else s+=Math.max(0,r.w*1.5-r.c);if(mastered(c))s-=1;return [s,c]});
  w.sort((a,b)=>b[0]-a[0]);
  return w.slice(0,n).map(x=>x[1]);
}
function distractors(c,diff,mode){
  const f=BY[c];const out=new Set();
  const add=list=>list.forEach(x=>{if(out.size<3)out.add(x)});
  const groups=GROUP_OF[c]||[];
  const gm=shuffle(groups.flatMap(i=>GROUPS[i].f).filter(x=>x!==c));
  const same=shuffle(FLAGS.filter(x=>x.r===f.r&&x.c!==c).map(x=>x.c));
  const any=shuffle(FLAGS.map(x=>x.c).filter(x=>x!==c));
  if(mode==="group"||diff==="hard"||diff==="expert"){add(gm);add(same)}
  else if(diff==="medium"){add(same)}
  add(any);
  return [...out];
}
function goBack(){
  clearTimeout(S.timer);
  const f=S.from||{view:"home",tab:"quiz"};
  S={view:f.view,tab:f.tab||"quiz",region:f.region};render();
  window.scrollTo(0,f.scroll||0);
}
function startRound(mode,arg,label){
  const pool=poolFor(mode,arg);
  if(!pool.length)return;
  const from=S.view==="quiz"||S.view==="done"?S.from:{view:S.view,tab:S.tab,region:S.region,scroll:window.scrollY};
  const diff=SET.dir==="flag"&&SET.diff==="expert"?"hard":SET.diff;
  let order,full;
  if(mode==="group"){full=SET.len==="all";
    const n=SET.len==="all"?pool.length*2:SET.len;
    order=[];while(order.length<n){let sh=shuffle(pool);if(pool.length>1&&order.length&&sh[0]===order[order.length-1])sh.push(sh.shift());order.push(...sh)}order=order.slice(0,n);
  } else {
    const n=SET.len==="all"?pool.length:Math.min(SET.len,pool.length);full=n===pool.length;
    order=pickOrder(pool,n);
  }
  const qs=order.map(c=>({c,opts:shuffle([c,...distractors(c,diff,mode)]),ans:null,typed:""}));
  S={view:"quiz",mode,arg,label,qs,i:0,streak:0,best:0,diff:mode==="group"&&diff!=="expert"?"hard":diff,dir:SET.dir,pace:SET.pace,from,full};
  render();window.scrollTo(0,0);
}

}

function answer(k){
  const q=S.qs[S.i];if(q.ans)return;
  q.ans=k;const ok=k===q.c;
  const r=rec(q.c);const pts=PTS[S.diff]||0;
  if(ok){r.c++;r.s=Math.min(8,(r.s||0)+pts);q.pts=pts}else{r.w++;r.s=Math.max(-4,(r.s||0)-2);q.pts=-2}
  q.nowMastered=ok&&r.s>=MASTER&&r.s-pts<MASTER;
  prog[q.c]=r;save();
  S.streak=ok?S.streak+1:0;S.best=Math.max(S.best,S.streak);
  render();
  if(S.pace==="drill"&&ok){clearTimeout(S.timer);S.timer=setTimeout(next,650);return}
  requestAnimationFrame(()=>{const btns=app.querySelectorAll(".btn");const b=btns[btns.length-1];if(b)b.scrollIntoView({block:"end",behavior:"smooth"})});
}

// Keyboard: A-D or 1-4 pick an option, Enter moves on.
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target.tagName;if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA"||t==="BUTTON")return;
  const q=S.qs[S.i];
  if(e.key==="Escape"){goBack();return}
  if(e.key==="Enter"){if(q.ans){e.preventDefault();next()}return}
  if(q.ans)return;
  const k=e.key.toLowerCase();let i=-1;
  if(k>="a"&&k<="d")i=k.charCodeAt(0)-97;else if(k>="1"&&k<="4")i=+k-1;
  if(i>=0&&q.opts&&q.opts[i]){e.preventDefault();answer(q.opts[i])}
});

  return `${shell()}
  <p class="muted small">Name the flag, then read what it stands for. Pick a region or the whole world, set the difficulty, and play in Learn or Drill. Flags you miss come back sooner.</p>
  <div class="kbd"><span class="eyebrow">Keyboard</span><span><kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> answer</span><span><kbd>Enter</kbd> continues</span><span><kbd>Esc</kbd> leaves the round</span></div>
  <div class="card">
    <div class="seg"><span class="label">Round length</span><div class="btns">
      ${[[10,"10"],[25,"25"],["all","Full set"]].map(([v,l])=>`<button class="${SET.len===v?"on":""}" onclick="setOpt('len',${typeof v==="string"?"'all'":v})">${l}</button>`).join("")}</div></div>
    <div class="seg"><span class="label">Difficulty</span><div class="btns">
      ${["easy","medium","hard","expert"].map(d=>`<button class="${SET.diff===d?"on":""}${d==="expert"&&SET.dir==="flag"?" off":""}" onclick="setOpt('diff','${d}')">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}</div>
      <span class="note">${SET.dir==="flag"&&SET.diff==="expert"?"Typed answers need the flag shown; switch to country names.":DIFF[SET.diff]}</span></div>
    <div class="seg"><span class="label">Answer with</span><div class="btns">
      <button class="${SET.dir==="name"?"on":""}" onclick="setOpt('dir','name')">Country name</button>
      <button class="${SET.dir==="flag"?"on":""}" onclick="setOpt('dir','flag')">Pick the flag</button></div>
      <span class="note">${SET.dir==="flag"?"You see the country and choose among four flags.":"You see the flag and choose or type the country."}</span></div>
    <div class="seg"><span class="label">Pace</span><div class="btns">
      <button class="${SET.pace==="learn"?"on":""}" onclick="setOpt('pace','learn')">Learn</button>
      <button class="${SET.pace==="drill"?"on":""}" onclick="setOpt('pace','drill')">Drill</button></div>
      <span class="note">${SET.pace==="drill"?"Correct answers advance automatically.":"Shows what the flag means after each answer."}</span></div>
  </div>
  <div class="tiles">${tiles()}
    <button class="tile wide" onclick="startRound('all',null,'Whole world')"><span class="name">Whole world</span><span class="count">${total} flags</span></button>
    <button class="tile wide" onclick="startRound('weak',null,'Weak spots')" ${weak?"":"disabled style='opacity:.5'"}><span class="name">Weak spots</span><span class="count">${weak?weak+" to fix":"nothing missed yet"}</span></button>
    <button class="tile wide" onclick="setTab('badges')"><span class="name">Badges</span><span class="count">${nb} / ${BADGES.length} earned ›</span></button>
  </div>
  <div class="foot"><span class="small muted">Progress is saved on this device.</span><button class="link" onclick="resetAsk()">Reset progress</button></div>`;
}
function resetAsk(){
  const f=app.querySelector(".foot");
  f.innerHTML=`<span class="small">Clear all progress?</span><span class="row" style="flex:none"><button class="link" onclick="prog={};badges={};save();saveB();render()">Yes, clear</button><button class="link" onclick="render()">Keep</button></span>`;
}
function viewQuiz(){
  const q=S.qs[S.i],f=BY[q.c],n=S.qs.length;
  const dots=n>30?`<i class="now" style="flex:${S.i+1} 1 0"></i><i style="flex:${n-S.i-1} 1 0"></i>`:S.qs.map((x,i)=>`<i class="${x.ans?(x.ans===x.c?"ok":"bad"):(i===S.i?"now":"")}"></i>`).join("");
  const letters="ABCD";
  const reverse=S.dir==="flag",typed=S.diff==="expert"&&!reverse;
  let prompt,opts;
  if(reverse){
    prompt=`<p class="eyebrow">Which flag?</p><p class="ask">${esc(f.n)}</p>`;
    opts=`<div class="flagopts">${q.opts.map((c,i)=>{
      let cls="fopt";if(q.ans){if(c===q.c)cls+=" right";else if(c===q.ans)cls+=" wrong";else cls+=" dim"}
      return `<button class="${cls}" ${q.ans?"disabled":""} onclick="answer('${c}')">${img(c,"flag sm")}<span class="key">${letters[i]}${q.ans?" · "+esc(BY[c].n):""}</span></button>`}).join("")}</div>`;
  } else if(typed){
    prompt=`${img(q.c)}<p class="eyebrow">Which country? Type it.</p>`;
    opts=q.ans?"":`<form class="typebox" onsubmit="event.preventDefault();submitTyped()">
      <input id="typeIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Country name" value="${esc(q.typed||"")}" oninput="typeInput(this.value)">
      <div class="sugg" id="sugg"></div>
      <div class="row"><button type="submit" class="btn">Check</button><button type="button" class="btn line" onclick="answer('__wrong__')">Reveal</button></div></form>`;
  } else {
    prompt=`${img(q.c)}<p class="eyebrow">Which country?</p>`;
    opts=`<div class="opts">${q.opts.map((c,i)=>{
      let cls="opt";if(q.ans){if(c===q.c)cls+=" right";else if(c===q.ans)cls+=" wrong";else cls+=" dim"}
      return `<button class="${cls}" ${q.ans?"disabled":""} onclick="answer('${c}')"><span class="key">${letters[i]}</span><span>${esc(BY[c].n)}</span></button>`}).join("")}</div>`;
  }
  let reveal="";
  if(q.ans){
    const ok=q.ans===q.c,picked=BY[q.ans];
    let miss="";
    if(!ok){
      const gi=GROUP_OF[q.c]&&GROUP_OF[q.c].find(i=>GROUPS[i].f.includes(q.ans));
      const hint=gi!==undefined&&gi!==null?esc(GROUPS[gi].h):"";
      if(picked)miss=`<div class="row" style="align-items:center"><div style="flex:0 0 72px">${img(q.ans,"flag sm")}</div><p class="small muted">You picked ${esc(picked.n)}. ${hint}</p></div>`;
      else miss=`<p class="small muted">${q.typed?`"${esc(q.typed)}" didn't match a country.`:"Revealed."}</p>`;
    }
    const pill=`<span class="pill ${ok?(q.pts?"ok":""):"bad"}" style="font-family:var(--mono);font-size:12px;vertical-align:middle">${q.nowMastered?"learned":q.pts>0?"+"+q.pts:q.pts===0?"no points on easy":q.pts}</span>`;
    if(S.pace==="drill"&&!q.lore){
      reveal=ok?`<div class="card lore" style="padding:12px 16px"><p class="verdict ok">Correct · ${esc(f.n)} ${pill}</p></div>`
      :`<div class="card lore">
        <p class="verdict bad">Not quite ${pill}</p>
        <div><h2>${nameLink(q.c)}</h2><p class="capital">${capLine(q.c)}</p></div>
        ${reverse?img(q.c):""}${miss}
        <button class="link" style="text-align:left" onclick="showLore()">Show the story</button>
      </div>
      <button class="btn" onclick="next()">${S.i+1<n?"Next":"See results"}</button>`;
    } else
    reveal=`<div class="card lore">
      <p class="verdict ${ok?"ok":"bad"}">${ok?"Correct":"Not quite"}${S.streak>=3?` · ${S.streak} in a row`:""} ${pill}</p>
      ${reverse?img(q.c):""}
      <div><h2>${nameLink(q.c)}</h2><p class="capital">${capLine(q.c)}</p></div>
      <p>${esc(f.m)}</p>
      ${miss}
    </div>
    <button class="btn" onclick="next()">${S.i+1<n?"Next":"See results"}</button>`;
  }
  const right=S.qs.filter(x=>x.ans===x.c).length;
  return `
  <div class="sticky"><div class="top"><button class="back" onclick="goBack()">‹ ${esc(S.label)}</button><span class="stat">${right} right · ${S.i+1} / ${n}</span></div>
  <div class="progress">${dots}</div></div>
  ${prompt}
  ${opts}
  ${reveal}`;
}
const SITE="https://maxlep.github.io/flag-game/";
function shareGrid(){
  const n=S.qs.length,right=S.qs.filter(q=>q.ans===q.c).length;
  if(n<=50){const sq=S.qs.map(q=>q.ans===q.c?"🟩":"🟥");const rows=[];for(let i=0;i<n;i+=10)rows.push(sq.slice(i,i+10).join(""));return rows.join("\n")}
  const k=20,red=Math.round((n-right)/n*k);return "🟩".repeat(k-red)+"🟥".repeat(red);
}
function shareText(){
  const n=S.qs.length,right=S.qs.filter(q=>q.ans===q.c).length;
  const diff=S.diff[0].toUpperCase()+S.diff.slice(1),mode=S.dir==="flag"?" · pick the flag":"";
  return `Flag Game · ${S.label} · ${diff}${mode}\n${right}/${n}${S.best>=5?` · streak ${S.best}`:""}\n${shareGrid()}\n${SITE}`;
}
async function share(){
  const text=shareText(),btn=$("#shareBtn");
  try{if(navigator.share){await navigator.share({text});btn.textContent="Shared";return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text);btn.textContent="Copied to clipboard"}
  catch(e){const ta=$("#shareTa");ta.hidden=false;ta.value=text;ta.focus();ta.select();btn.textContent="Copy the text below"}
}
function viewDone(){
  const right=S.qs.filter(q=>q.ans===q.c).length,n=S.qs.length;
  const missed=S.qs.filter(q=>q.ans!==q.c);
  const word=right===n?"Perfect round":right>=n*.7?"Strong round":right>=n*.4?"Getting there":"Keep at it";
  const crown=(S.earned||[]).map(id=>{const b=BADGE[id];return `<div class="card newbadge"><div class="row" style="flex-wrap:nowrap"><span class="be" style="flex:none">${b.e}</span><div><p class="eyebrow">New badge</p><h2>${id==="lord"?"You are the Flag Lord.":b.n}</h2><p class="small muted">${b.h}</p></div></div></div>`}).join("");
  return `
  <div class="top"><button class="back" onclick="goBack()">‹ Back</button><span class="stat">${esc(S.label)}</span></div>
  ${crown}
  <div class="card" style="align-items:flex-start">
    <p class="eyebrow">${word}</p>
    <p class="score">${right}<span class="muted" style="font-size:24px"> / ${n}</span></p>
    <p class="small muted">Best streak this round: ${S.best}</p>
    <p class="grid">${shareGrid().replace(/\n/g,"<br>")}</p>
    <button class="btn line" id="shareBtn" onclick="share()">Share result</button>
    <textarea class="sharebox" id="shareTa" hidden readonly aria-label="Result text to copy"></textarea>
  </div>
  ${missed.length?`<div class="card"><h3>Missed</h3><div class="missed">${missed.map(q=>`<span class="chip">${img(q.c,"flag")}${esc(BY[q.c].n)}</span>`).join("")}</div></div>`:""}
  <button class="btn" onclick="startRound(S.mode,S.arg,S.label)">Play again</button>
  <button class="btn ghost" onclick="goBack()">Choose another set</button>`;
}
function viewStudy(){
  const r=S.region;
  const opts=[...REGIONS,"Whole world","Look-alikes"].map(x=>`<option value="${x}" ${x===r?"selected":""}>${x==="Look-alikes"?"Look-alikes · "+GROUPS.length+" sets":x==="Whole world"?"Whole world · "+FLAGS.length+" flags":x+" · "+FLAGS.filter(f=>f.r===x).length+" flags"}</option>`).join("");
  let body;
  if(r==="Look-alikes"){
    const order=["Horizontal stripes","Vertical stripes","Cantons & crosses","Discs & stars","Triangles & serrations"];
    const sorted=GROUPS.map((g,i)=>({g,i,r:g.k})).sort((a,b)=>order.indexOf(a.r)-order.indexOf(b.r)||a.g.t.localeCompare(b.g.t));
    let lastR="";
    body=sorted.map(({g,i,r})=>(r!==lastR?`<p class="eyebrow" style="padding-top:6px">${esc(lastR=r)}</p>`:"")+`<div class="group"><h3>${esc(g.t)}</h3><div class="flags">${g.f.map(c=>`<figure>${img(c,"flag sm")}<figcaption>${esc(BY[c].n)}</figcaption></figure>`).join("")}</div><p class="hint">${esc(g.h)}</p><button class="btn line" onclick="startRound('group',${i},GROUPS[${i}].t)">Quiz me on this set</button></div>`).join("");
  } else {
    const list=r==="Whole world"?FLAGS.slice().sort((a,b)=>a.n.localeCompare(b.n)):FLAGS.filter(f=>f.r===r);
    body=list.map(f=>`<div class="entry"><a class="flink" href="${links(f.c).flag}" target="_blank" rel="noopener" title="The flag on Wikipedia">${img(f.c,"flag sm")}</a><div class="t"><span class="name">${nameLink(f.c)} ${mastered(f.c)?'<span class="pill ok">learned</span>':rec(f.c).s>0?'<span class="pill">'+rec(f.c).s+' / '+MASTER+'</span>':rec(f.c).w>0?'<span class="pill bad">missed '+rec(f.c).w+'</span>':""}</span><span class="capital">${capLine(f.c)}</span><p>${esc(f.m)}</p></div></div>`).join("");
  }
  return `${shell(`<select id="studySel" onchange="S.region=this.value;render();window.scrollTo(0,0)">${opts}</select>`)}
  <div class="study">${body}</div>
`;
}

// ---------- BOOT ----------
load();loadSet();loadB();
function start(data){ if(data&&data.S)S=data.S; render(); }
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
